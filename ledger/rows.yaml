- id: LGR-009
  title: a signal match authorizes reading the packet, never executing anything
  contract:
    file: contracts/packet.v1.md
    clause: "Core 6"
    quote: |
      A signal match authorizes reading the packet — it never authorizes
      executing any command, skill, install, or edit the packet describes.
  disposition: CONFORMS
  assertion:
    kind: indexed
    ref:
      - modules/hooks-wayfinder/tests/test_prompt_builders.py::test_signal_summon_topical_match_authorizes_packet_read_only
      - modules/hooks-wayfinder/tests/test_prompt_builders.py::test_self_intro_uses_the_same_consent_and_native_approval_boundary
      - modules/hooks-wayfinder/tests/test_prompt_builders.py::test_hint_block_distinguishes_direct_request_from_optional_offer
      - modules/hooks-wayfinder/tests/test_prompt_builders.py::test_catalog_and_menu_prompts_apply_the_same_consent_boundary
      - modules/hooks-wayfinder/tests/test_prompt_builders.py::test_vision_and_packet_authoring_contract_preserve_signal_boundary
  notes: >
    These cites assert the boundary in the consumer's own injected wording
    (the surface a model actually reads), not merely in prose. The last cite
    additionally guards the boundary's three documented homes — VISION.md (the
    principle + pointer), contracts/packet.v1.md Core 6 (the mechanics), and
    skills/wayfinder-pack/SKILL.md (authoring) — so it can never silently
    vanish from one of them.

- id: LGR-010
  title: prompt_matches patterns are conservative and word-boundary
  contract:
    file: contracts/packet.v1.md
    clause: "Core 6"
    quote: |
      they use conservative, word-boundary patterns
  disposition: NOT-ASSERTABLE
  assertion:
    kind: none
  justification: >
    "Conservative" is a reviewer judgment with no discriminating machine check:
    a regex can be syntactically word-boundaried (`\b...\b`) and still match far
    too broadly, and a pattern with no `\b` can still be narrow. Asserting mere
    `\b` presence would manufacture a green that does not mean what the clause
    means. Named here rather than folded into LGR-008's compilation check.
    Reviewed at authoring/PR time against the authoring skill's guidance.
  notes: >
    Real cost already paid on this axis: a captured session (0629f373) had a
    model treat a wayfinder offer as mandatory off a loose match. The
    consumer's structural mitigation is the subordination guard prepended to
    every injected block (__init__.py:72-88), asserted by
    test_prompt_builders.py::test_every_injected_block_leads_with_the_subordination_guard.
    Promotion path: if a mechanical conservativeness heuristic is ever agreed,
    this becomes a probe.

# --------------------------------------------------------------------------- #
# Core 7 — commands verified at authoring time
# --------------------------------------------------------------------------- #
- id: LGR-011
  title: verified_at (ISO date) and provenance recorded on every packet
  contract:
    file: contracts/packet.v1.md
    clause: "Core 7"
    quote: |
      `verified_at` (ISO date) is required and records that verification;
      `provenance` records its basis (what was checked, against what source).
  disposition: CONFORMS
  assertion:
    kind: indexed
    ref:
      - modules/hooks-wayfinder/tests/test_packet_contract.py::test_real_packet_conforms_to_core_clauses
      - modules/hooks-wayfinder/tests/test_packet_contract.py::test_fixture_fails_exactly_its_targeted_clause
  notes: >
    Discriminating fixtures: missing-verified-at.md and bad-verified-at.md
    (both C7). This row asserts the RECORD of verification; the verification
    itself is LGR-012.

- id: LGR-012
  title: every try_now entry is runnable as written at authoring time
  contract:
    file: contracts/packet.v1.md
    clause: "Core 7"
    quote: |
      Every `try_now` entry is runnable as written when the packet is authored
      or revised.
  disposition: NOT-ASSERTABLE
  assertion:
    kind: none
  justification: >
    Proving a command is runnable requires EXECUTING it against live host and
    CLI state (installed tooling, network, provider config) — outside a
    contributor-runnable kit the contract itself scopes as "Plain pytest: no
    DTU, no network, no model". Verification happens out-of-band at authoring
    time; its recorded evidence is the `verified_at`/`provenance` pair asserted
    by LGR-011, which is the strongest in-process proxy available and is
    deliberately not presented as proof of runnability.
  notes: >
    Drift risk this row names honestly: `verified_at` can go stale silently —
    a command verified on 2026-08-19 may no longer be runnable today, and no
    check here would notice. Real precedent: a stale "role wins, pin is
    fallback" claim in the pinning bulletin was caught only by re-verifying
    against docs at authoring time. Candidate mitigation for a later wave: a
    staleness tripwire on `verified_at` age (a freshness heuristic, not a
    runnability proof) — deliberately NOT asserted here, because a green age
    check would read as a green runnability check.

