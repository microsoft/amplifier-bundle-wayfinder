# --------------------------------------------------------------------------- #
- id: LGR-008
  title: every signals.prompt_matches regex compiles
  contract:
    file: contracts/packet.v1.md
    clause: "Core 6"
    quote: |
      `signals.prompt_matches` regexes must compile
  disposition: CONFORMS
  assertion:
