# --------------------------------------------------------------------------- #
# Conformance section — maintainer-side behavioral check
# --------------------------------------------------------------------------- #
- id: LGR-014
  title: maintainer-side DTU live-render pass (worked example)
  contract:
    file: contracts/packet.v1.md
    clause: "Conformance"
    quote: |
      a DTU live-render pass — menu listing, signal match with the consent
      boundary held, deep-dive via `action`, rotation eligibility — retained as
      a checkable artifact.
  disposition: NOT-ASSERTABLE
  assertion:
    kind: none
  justification: >
    The contract itself rules this check NOT-ASSERTABLE in-process,
    justification: out-of-band DTU procedure. It requires a live Digital Twin
    Universe instance running a real session against a real provider — no
    in-process, no-network, no-model check can stand in for it. Ratified as
    NOT-ASSERTABLE by converge:protocol-authority, 2026-09-03.
  notes: >
    Current worked example / retained artifact: the smart-tools bulletin render
    pass of 2026-09-02, evidence recorded on wayfinder PR #9. Out-of-band
    procedure to refresh it: launch a DTU with the bundle installed, then
    exercise (a) menu listing, (b) a signal match with the consent boundary
    held, (c) deep-dive via the packet's own `action`, (d) rotation
    eligibility. Reviewed at cadence — never silently trusted; a stale worked
    example is a real finding, not a green.

# --------------------------------------------------------------------------- #
# Open questions pinned against current behavior
# --------------------------------------------------------------------------- #
- id: LGR-015
  title: packet filename stem need not equal its id (undecided; pinned)
  contract:
    file: contracts/packet.v1.md
    clause: "Core 2"
    quote: |
      `id` is the packet's stable identity across every mechanism that
      references it: decline-memory, rotation seen-memory, menu keying, signal
      hint dedup.
  disposition: OPEN-PINNED
  assertion:
    kind: probe
    ref: test_row_lgr_015
  justification: >
    Undecided call, deliberately not forged into a clause. The contract makes
    `id` the identity and says nothing about the FILENAME; C1 only requires the
    packet be a single file under a registered source. One live packet
    exercises that latitude: content/bulletins/current.md carries
    `id: switch-models` — a leftover of the Ring-0 "one current bulletin"
    shape, now that the hook rotates multiple promoted bulletins and
    `current.md` is no longer singular in meaning. Note the authoring skill's
    own worked example uses `id: switch-models` (SKILL.md:97) while shipping
    inside `current.md`. Renaming is plausible but is a decision (it changes a
    public `action` mention path), so the current state is PINNED rather than
    silently "fixed" or silently spread.
  notes: >
    The probe pins the exact divergence SET, so drift flips it in BOTH
    directions: renaming current.md → switch-models.md flips it (the decision
    got made — record it), and introducing a SECOND filename≠id packet also
    flips it (the latitude spread — decide before it becomes the norm). Two
    legal exits on a flip: revert, or in the same change update this row (and
    the contract, if the call is to require agreement). Doing neither means
    main carries a ledger that lies. That is drift.
