# Conformance ledger — wayfinder
#
# Format: converge:docs/LEDGER-FORMAT.md (DRAFT convention). Semantics of the
# disposition vocabulary: converge PROTOCOL.md §3.3. This file is a top-level
# YAML LIST of rows — no wrapper mapping, no `meta:` key. LGR-000 is the SYNC
# row (§4).
#
# SEEDed 2026-09-03 against contracts/packet.v1.md (FROZEN) at repo fd1f48c.
#
# Local conventions (deviations are data for ledger-format v1):
#   - `assertion.kind: indexed` cites the repo's OWN conformance kit as a LIST
#     of "<path>::<test name>" strings, verified statically (parse, don't
#     import). The kit is the contract's required gate; the ledger indexes it
#     rather than reimplementing it.
#   - `assertion.kind: probe` / `absence` cite a function name in
#     ledger/checks/test_ledger.py. The ledger owns probes ONLY for clauses the
#     repo's kit deliberately declines to assert (C1, C5 — see the kit
#     docstring) and for the ledger's own integrity.
#   - The SYNC row carries an extra `sync:` list (path + sha256 + pinned repo
#     sha). The format specifies content only ("path + content hash"), not shape.

- id: LGR-000
  title: SYNC — contract file pin (hash mismatch ⇒ mandatory full-ledger re-review)
  contract:
    file: contracts/packet.v1.md
    clause: SYNC
    quote: |
      **Status: FROZEN** — ratified by the owner (bkrabach), 2026-09-03.
  sync:
    - path: contracts/packet.v1.md
      sha256: 634ef92c9a360eb6a63a1d9887de8bb145b3ce02f9548009e9d9bf9929e29343
      pinned_at_repo_sha: fd1f48c2292278cd355648f6a7fda121c5cca623
  disposition: CONFORMS
  assertion:
    kind: probe
    ref: test_row_lgr_000
  notes: >
    A mismatch is NOT a silent hash bump. It triggers a full-ledger re-review:
    quote verification proves the quoted text still exists; only the re-review
    confirms each row's READING of it is still correct.

# --------------------------------------------------------------------------- #
# Core 1 — one file, one packet
# --------------------------------------------------------------------------- #
- id: LGR-001
  title: one file, one packet — registered content source; 1:1 file↔packet
  contract:
    file: contracts/packet.v1.md
    clause: "Core 1"
    quote: |
      A packet is a single markdown file under a registered content source
      (today: `content/bulletins/`, `content/practices/`, `content/concepts/`).
      No packet spans files; no file carries two packets.
  disposition: CONFORMS
  assertion:
    kind: probe
    ref: test_row_lgr_001
  notes: >
    Ledger-owned probe by design: the repo's contract kit explicitly declines
    C1 as "structural properties of the consumer's own architecture, not
    per-packet frontmatter shape" (test_packet_contract.py docstring, lines
    27-31). Code evidence for the structural half: load_catalog
    (amplifier_module_hooks_wayfinder/__init__.py:436-443) makes exactly ONE
    _item_from_meta call per rglob'd file, and parse_frontmatter
    (__init__.py:349-373) consumes only the FIRST `---` block — so a file can
    contribute at most one packet. The probe asserts the observable form:
    every discovered packet sits under one of the three registered dirs, and
    the derived catalog is a bijection between files and item ids (12/12 at
    seed time).

# --------------------------------------------------------------------------- #
# Core 2 — id
# --------------------------------------------------------------------------- #
- id: LGR-002
  title: id required, kebab-case, unique within this repo's content sources
  contract:
    file: contracts/packet.v1.md
    clause: "Core 2"
    quote: |
      required, kebab-case, unique.
  disposition: CONFORMS
  assertion:
    kind: indexed
    ref:
      - modules/hooks-wayfinder/tests/test_packet_contract.py::test_real_packet_conforms_to_core_clauses
      - modules/hooks-wayfinder/tests/test_packet_contract.py::test_ids_are_unique_across_real_packets_only
      - modules/hooks-wayfinder/tests/test_packet_contract.py::test_fixture_fails_exactly_its_targeted_clause
  notes: >
    Discriminating fixtures: missing-id.md (C2+C3) and bad-id-format.md (C2).
    Uniqueness scope here is this repo's content/** only — the cross-source
    half is LGR-003.

- id: LGR-003
  title: id uniqueness across ALL content sources composed into a session
  contract:
    file: contracts/packet.v1.md
    clause: "Core 2"
    quote: |
      Unique across ALL content sources composed into a session.
  disposition: NOT-ASSERTABLE
  assertion:
    kind: none
  justification: >
    Not assertable in-process from this repo: only one content source exists
    here (the auto-detected own-dir). Cross-source uniqueness is a runtime
    property of a session that composes a second `content_sources` pack, which
    lives in another bundle's hook config. The consumer's documented tolerance
    on collision is first-id-wins with a warning
    (amplifier_module_hooks_wayfinder/__init__.py:448-457) — NOT enforcement —
    and the contract itself Backlogs the policy ("Multi-source `id` collision
    policy (first-wins today)", promotes when a second non-internal content
    source lands). So this is a judgment-reviewed clause today, not a machine
    check; it is named here rather than smuggled into LGR-002's green.
  notes: >
    Review cadence: revisit when the Backlogged multi-source collision policy
    promotes. At that point this row should become a probe over a two-source
    load_catalog fixture.

# --------------------------------------------------------------------------- #
# Core 3 — required frontmatter fields
# --------------------------------------------------------------------------- #
- id: LGR-004
  title: required frontmatter fields present; category in registered vocabulary
  contract:
    file: contracts/packet.v1.md
    clause: "Core 3"
    quote: |
      **Required frontmatter fields:** `id`, `category`, `headline`, `trigger`,
      `action`. `category` is one of the registered vocabulary (`bulletin`,
      `practice`, `concept`; expansion is Reserved).
  disposition: CONFORMS
  assertion:
    kind: indexed
    ref:
      - modules/hooks-wayfinder/tests/test_packet_contract.py::test_real_packet_conforms_to_core_clauses
      - modules/hooks-wayfinder/tests/test_packet_contract.py::test_fixture_fails_exactly_its_targeted_clause
  notes: >
    Discriminating fixtures: missing-headline.md, bad-category.md,
    missing-action.md (each C3), plus missing-id.md (C2+C3).
    Content-accuracy watch (not a clause finding): content/concepts/
    about-wayfinder.md tells users "Pro-tips ride the same rails when there are
    any." That is conditional and therefore honest today, but a `pro-tips`
    category is Backlogged (promotes when the first pro-tip packet ships) and
    is NOT in the registered vocabulary. If a packet ever carries
    `category: pro-tip` before that clause promotes, this row goes VIOLATION.
    The "headline is one plain line: outcome + why-you-care" and "trigger is
    prose describing when the offer is genuinely relevant" qualities are
    authoring judgment; the kit asserts presence/non-emptiness only.

