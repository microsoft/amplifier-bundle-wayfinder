      - modules/hooks-wayfinder/tests/test_packet_contract.py::test_fixture_fails_exactly_its_targeted_clause
  notes: >
    Discriminating fixture: bad-regex.md (C6). Note the consumer itself is
    lenient at runtime — _compile_patterns (__init__.py:386-395) logs and skips
