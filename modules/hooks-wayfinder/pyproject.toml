[project]
name = "amplifier-module-hooks-wayfinder"
version = "0.1.0"
description = "Wayfinder's Ring 1 hook: session:start bulletin surfacing, frontmatter-derived catalog index, deterministic decline-filter, and one conservative prompt-signal nudge."
readme = "README.md"
requires-python = ">=3.11"
# amplifier-core is a PEER dependency (provided by the host process) — do NOT declare it.
# PyYAML is a real third-party dependency, used to parse per-item frontmatter.
dependencies = ["pyyaml>=6.0"]

[project.entry-points."amplifier.modules"]
hooks-wayfinder = "amplifier_module_hooks_wayfinder:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_hooks_wayfinder"]
