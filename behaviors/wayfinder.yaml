bundle:
  name: wayfinder-behavior
  version: 0.2.0
  description: Wires wayfinder's channel — voice, propose-and-ack protocol, a thin derived-catalog note, and the hooks-wayfinder hook (session:start bulletin surfacing + frontmatter-derived catalog + deterministic decline-filter + one conservative prompt-signal).

# Always-on files — deliberately just two, both pure every-turn material:
#   wayfinder-voice.md   — the one-voice register + points-not-absorb boundary
#   propose-and-ack.md   — the consent floor (propose→show→ack→act)
# The offer catalog and the "bodies come from action, never glob" rule are NOT
# always-on: hooks-wayfinder DERIVES the catalog from per-item frontmatter and
# injects it — with that action-delivery directive — EPHEMERALLY, per surface.
# Offer-time / authoring procedure (packet shape, invocation + install detail)
# lives on-demand in the wayfinder-pack skill. Bulletin BODIES stay on-demand via
# each packet's own `action`.
context:
  include:
    - wayfinder:context/wayfinder-voice.md
    - wayfinder:context/propose-and-ack.md

# Authoring skill: how to write a good wayfinder packet. Loaded on demand
# (visibility ~1 line; body only when invoked), so it costs nothing until a
# contributor reaches for it. Sourced via tool-skills config, not context.
tools:
  - module: tool-skills
    config:
      skills:
        - "@wayfinder:skills"

# Ring 1: wayfinder's first Python. Deterministic, ephemeral, config-tunable.
hooks:
  - module: hooks-wayfinder
    # Resolved relative to THIS behavior file (behaviors/), so the repo-root
    # modules/ dir is one level up. `./modules/...` breaks the --app install
    # (#subdirectory=behaviors/wayfinder.yaml makes behaviors/ the base dir).
    source: ../modules/hooks-wayfinder
    config:
      enabled: true
      # content_dir: auto-detected as <bundle>/content when unset.
      content_dir: null
      # declines_path: ${AMPLIFIER_WAYFINDER_DIR:-~/.amplifier/wayfinder}/declines.md when unset.
      declines_path: null
      # prompt_matches signal layer on/off (the per-item regex lives in frontmatter).
      signals_enabled: true
      # derive-vs-curate line. false = derive-first (all items); true = only `curated: true`.
      curate: false
      # per-session cap on signal nudges (on top of one-per-offer-per-session).
      max_hints_per_session: 3
